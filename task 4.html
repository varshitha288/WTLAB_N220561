<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sthri Vasthra</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f7f4f5;
        }

        header {
            text-align: center;
            padding: 40px;
            background: #7a2e3a;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: white;
        }

        .filters button {
            margin: 5px;
            padding: 8px;
            cursor: pointer;
        }

        #search {
            padding: 8px;
            width: 200px;
        }

        .cart {
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        .card button {
            background: #7a2e3a;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 20px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Sthri Vasthra</h1>
    <p>Modern + Traditional Fashion</p>
</header>

<nav>
    <div class="filters">
        <button onclick="filterItems('all')">All</button>
        <button onclick="filterItems('saree')">Sarees</button>
        <button onclick="filterItems('kurti')">Kurtis</button>
        <button onclick="filterItems('festive')">Festive</button>
    </div>

    <input type="text" id="search" placeholder="Search..." onkeyup="searchItems()">

    <div class="cart">🛒 Cart: <span id="cartCount">0</span></div>
</nav>

<div class="grid" id="productGrid"></div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <p id="modalDesc"></p>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    const products = [
        { name: "Silk Saree", category: "saree", desc: "Elegant silk wear" },
        { name: "Cotton Kurti", category: "kurti", desc: "Daily comfort" },
        { name: "Festive Lehenga", category: "festive", desc: "Wedding wear" },
        { name: "Designer Saree", category: "saree", desc: "Party look" },
        { name: "Printed Kurti", category: "kurti", desc: "Casual wear" }
    ];

    let cart = 0;
    let currentFilter = "all";

    function displayProducts(list) {
        let grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        list.forEach(p => {
            let card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${p.name}</h3>
                <p>${p.category}</p>
                <button onclick="addToCart()">Add to Cart</button>
                <button onclick="openModal('${p.name}', '${p.desc}')">View</button>
            `;

            grid.appendChild(card);
        });
    }

    function filterItems(category) {
        currentFilter = category;
        let filtered = category === "all"
            ? products
            : products.filter(p => p.category === category);

        displayProducts(filtered);
    }

    function searchItems() {
        let value = document.getElementById("search").value.toLowerCase();

        let filtered = products.filter(p =>
            p.name.toLowerCase().includes(value)
        );

        displayProducts(filtered);
    }

    function addToCart() {
        cart++;
        document.getElementById("cartCount").innerText = cart;
    }

    function openModal(title, desc) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalDesc").innerText = desc;
        document.getElementById("modal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    // Initial Load
    displayProducts(products);
</script>

</body>
</html>
